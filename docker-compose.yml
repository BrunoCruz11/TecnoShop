services:
  postgres:
    image: postgres:16
    container_name: tecnoshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tecnoshop
      POSTGRES_PASSWORD: tecnoshop
      POSTGRES_DB: tecnoshop_db
    ports:
      - "5432:5432"
    volumes:
      - tecnoshop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tecnoshop -d tecnoshop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tecnoshop_pgdata:
